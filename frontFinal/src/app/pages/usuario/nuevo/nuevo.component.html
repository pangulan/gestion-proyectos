<div class="form-container">
  <form [formGroup]="proyectoForm" (ngSubmit)="guardarProyecto()">
    <section class="form-section">
      <h2>Agregar Nuevo Proyecto</h2>

      <!-- Campo de Nombre en Clave -->
      <div class="form-group">
        <label for="nombreClave">Nombre en Clave</label>
        <input 
          id="nombreClave" 
          formControlName="nombreClave" 
          type="text" 
          class="form-control" 
          placeholder="Ej. Proyecto A" 
          required />
      </div>

      <!-- Campo de Denominación Comercial -->
      <div class="form-group">
        <label for="denominacionComercial">Denominación Comercial</label>
        <input 
          id="denominacionComercial" 
          formControlName="denominacionComercial" 
          type="text" 
          class="form-control" 
          placeholder="Ej. Desarrollo de Software" 
          required />
      </div>

      <!-- Campo de Estado -->
      <div class="form-group">
        <label for="estado">Estado</label>
        <select 
          id="estado" 
          formControlName="estado" 
          class="form-control" 
          required>
          <option value="">Selecciona un estado</option>
          <option value="En Proceso">En Proceso</option>
          <option value="Completado">Completado</option>
        </select>
      </div>

      <!-- Campo de Fecha de Inicio -->
      <div class="form-group">
        <label for="fechaInicio">Fecha de Inicio</label>
        <input 
          id="fechaInicio" 
          formControlName="fechaInicio" 
          type="date" 
          class="form-control" 
          required />
      </div>

      <!-- Campo de Fecha de Fin -->
      <div class="form-group">
        <label for="fechaFin">Fecha de Fin</label>
        <input 
          id="fechaFin" 
          formControlName="fechaFin" 
          type="date" 
          class="form-control" 
          required />
      </div>

      <!-- Campo de Coordinador Identificación -->
      <div class="form-group">
        <label for="coordinadorIdentificacion">Coordinador</label>
        <select 
          id="coordinadorIdentificacion" 
          formControlName="coordinadorIdentificacion" 
          class="form-control" 
          required>
          <option value="">Selecciona un coordinador</option>
          <option *ngFor="let usuario of usuarios" [value]="usuario.id">
            {{ usuario.nombre }} {{ usuario.apellido }}
          </option>
        </select>
      </div>

      <!-- Botón de Enviar -->
      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="!proyectoForm.valid">Guardar Proyecto</button>
      </div>
    </section>
  </form>
</div>
