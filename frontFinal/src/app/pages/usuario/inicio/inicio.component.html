<section class="blur-background">
    <div class="container h-100">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-md-6 col-lg-4">
                <!-- Logo con animación de suavidad -->
                <div class="text-center mb-4">
                </div>
                
                <!-- Tarjeta de inicio de sesión -->
                <div class="card login-card">
                    <div class="card-header text-center">
                        <h1 class="fw-bold">Iniciar Sesión</h1>
                        <p class="text-muted">Bienvenido de nuevo, por favor ingrese sus credenciales</p>
                    </div>
                    <div class="card-body">
                        <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()" aria-labelledby="login-form">
                            <!-- Grupo de correo -->
                            <div class="form-group mb-3">
                                <label for="Username" class="form-label">Usuario</label>
                                <input 
                                    id="username" 
                                    formControlName="username" 
                                    class="form-control" 
                                    type="username" 
                                    placeholder="Ingrese su usuario" 
                                    required 
                                    aria-required="true"
                                />
                            </div>

                            <!-- Grupo de contraseña -->
                            <div class="form-group mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input 
                                    id="password" 
                                    formControlName="password" 
                                    class="form-control" 
                                    type="password" 
                                    placeholder="Ingrese su contraseña" 
                                    required 
                                    aria-required="true"
                                />
                            </div>

                            <!-- Botón de inicio de sesión -->
                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isLoading">
                                    <span *ngIf="!isLoading">Iniciar Sesión</span>
                                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <small class="text-muted">¿Olvidaste tu contraseña? <a href="#" class="text-primary">Recupérala aquí</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
