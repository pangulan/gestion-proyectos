<div class="documento-container">
  <div class="upload-section">
    <h3>Subir nuevo documento</h3>
    <form (ngSubmit)="subirDocumento()" #documentForm="ngForm" class="upload-form">
      <div class="form-group">
        <label for="descripcion">Descripción*</label>
        <input 
          type="text" 
          id="descripcion"
          [(ngModel)]="descripcion"
          name="descripcion"
          required
          class="form-control"
          placeholder="Ingrese una descripción">
      </div>

      <div class="file-input-group"> 
        <label class="file-select-button" [class.has-file]="selectedFile">
          <span class="icon">📎</span>
          <span>{{ selectedFile ? selectedFile.name : 'Seleccionar archivo' }}</span>
          <input 
            type="file" 
            (change)="onFileSelected($event)"
            accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.jpg,.png">
        </label>
        <small class="file-hint">Formatos permitidos: PDF, DOC, DOCX, XLS, XLSX, TXT, JPG, PNG</small>
      </div>

      <button 
        type="submit" 
        class="upload-button"
        [disabled]="!documentForm.form.valid || !selectedFile || isLoading">
        <span class="icon">⬆️</span>
        <span>{{ isLoading ? 'Subiendo...' : 'Subir documento' }}</span>
      </button>
    </form>
  </div>
</div>
